# Deploy DEV del portal NADF (apps/portal) — manual mientras se valida la fase 0.
# Requiere que el usuario de AWS del secreto pueda: cloudformation:DescribeStacks (nadf-portal-dev),
# s3:PutObject/DeleteObject/ListBucket (bucket del portal) y cloudfront:CreateInvalidation.
name: Deploy portal NADF (DEV)

on:
  workflow_dispatch:

concurrency:
  group: deploy-dev-portal
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test --workspace=@novus/nadf-portal
      - name: Build y publicación
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
        run: node apps/portal/scripts/deploy.mjs --stage dev
